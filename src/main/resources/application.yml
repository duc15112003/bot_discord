server:
  port: 8083
spring:
  jmx:
    enabled: false
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: bot-discord-server
  config:
    import:
      - optional:file:package-override.yaml
      - optional:file:product-config.yaml
      - "optional:file:./package-configuration-${spring.profiles.active}.json"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

# Discord bot configuration
discord:
  enable-guild-members-intent: ${DISCORD_ENABLE_GUILD_MEMBERS_INTENT:false}
  extra-tokens: ${DISCORD_EXTRA_TOKENS:}

# Lavalink audio server configuration
lavalink:
  nodes:
    - uri: ${LAVALINK_URI:ws://localhost:2333}
      password: ${LAVALINK_PASSWORD:youshallnotpass}
      name: main-node

# AI service configuration for music request parsing
app:
  ai:
    enabled: ${AI_ENABLED:true}
    provider: ${AI_PROVIDER:gemini}
    apiKey: ${AI_API_KEY:}
    apiUrl: ${AI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
    timeoutMs: ${AI_TIMEOUT_MS:10000}
    retryAttempts: ${AI_RETRY_ATTEMPTS:2}

logging:
  level:
    sun.rmi: WARN
    javax.management.remote.rmi: WARN
    root: INFO
    org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLogger: OFF
    org.apache.catalina.session: ERROR
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

