spring:
  datasource:
    url: ${env.datasource.url}
    username: ${env.datasource.username}
    password: ${env.datasource.password}
    driver-class-name: ${env.datasource.driver-class-name}
  h2:
    console:
      enabled: ${env.h2.console.enabled:true}
      path: ${env.h2.console.path:/h2-console}
  jpa:
    hibernate:
      ddl-auto: ${env.jpa.ddl-auto}
    show-sql: ${env.jpa.show-sql:false}
    properties:
      hibernate:
        format_sql: ${env.jpa.format_sql:false}

discord:
  token: ${env.discord.token}
  extra-tokens: ${env.discord.extra-token-1:},${env.discord.extra-token-2:},${env.discord.extra-token-3:}
app:
  jwt:
    secret: ${env.jwt.secret}
    expiration: ${env.jwt.expiration:3600000}
  ai:
    enabled: ${env.ai.enabled:${AI_ENABLED:false}}
    provider: ${env.ai.provider:${AI_PROVIDER:gemini}}
    apiKey: ${env.ai.apiKey:${AI_API_KEY:}}
    apiUrl: ${env.ai.apiUrl:${AI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}}
    model: ${env.ai.model:${AI_MODEL:gemini-2.5-flash}}
    timeoutMs: ${env.ai.timeoutMs:${AI_TIMEOUT_MS:45000}}
    retryAttempts: ${env.ai.retryAttempts:${AI_RETRY_ATTEMPTS:5}}

logging:
  level:
    root: ${env.logging.root:INFO}
    com.discord: ${env.logging.com-discord:INFO}
    dev.arbjerg.lavalink: ${env.logging.lavalink:INFO}
